<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Western Spritz — Line Dance Library</title>

  <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">

  <!-- PWA / Icone -->
  <link rel="icon" href="./assets/images/icon.png" />
  <link rel="apple-touch-icon" href="./assets/images/icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />

  <!-- Stili -->
  <link rel="stylesheet" href="./style.css?v=41" />
</head>
<body>

  <!-- Background -->
  <div id="bg-blur" class="bg blur"></div>
  <div id="bg-main" class="bg main"></div>

  <!-- SPLASH -->
  <div id="splash" class="splash">
    <img src="./assets/images/gruppo.png" class="splash-img" alt="Western Spritz" />
    
    <p class="splash-tip">Tocca “Avvia” per entrare</p>

    <!-- Contatore visite globale (testuale) -->
    <p class="splash-visit-label">Sei il visitatore</p>
    <div id="visitCounter" class="splash-counter">—</div>

    <button id="startApp" class="btn btn-primary splash-start">Avvia</button>

    <!-- Musica intro (auto-mute; sblocco al click) -->
    <audio id="introMusic" autoplay playsinline muted preload="auto">
      <source src="./assets/audio/some_people.mp3" type="audio/mpeg" />
    </audio>
  </div>

  <!-- Header -->
  <header class="hero" data-heat="true">
    <h1>Western Spritz — Line Dance Library</h1>
    <div id="count" class="count">Brani trovati: 0</div>

    <div class="filters">
      <input id="fDance" class="input" placeholder="Filtra per titolo del ballo…" />
      <input id="fSong"  class="input" placeholder="Filtra per titolo della canzone…" />
      <button id="clearFilters" class="btn ghost">Pulisci</button>
    </div>

    <div class="actions-top">
      <button id="btnUpdate" class="btn btn-primary">Aggiorna app</button>
      <button id="btnPuzzle" class="btn btn-puzzle">🎯 Gioco Puzzle</button>
      
      
      <button id="btnPlaylist" class="btn btn-primary">▶︎ Playlist</button>
    
    </div>

  </div>
</header>

  <!-- Cards -->
  <main id="cards" class="cards" aria-live="polite"></main>

  <footer class="footer">
    Western Spritz • Aggiungi l’app alla Home per un’esperienza migliore
  </footer>

  <!-- Overlay: PLAYLIST -->
  <div id="plModal" class="overlay hidden" aria-hidden="true">
    <div class="pl-card">
      <div class="pl-top">
        <h3>Le mie playlist</h3>
        <div class="gap8">
          <button id="plClear" class="btn ghost">Svuota</button>
          <button id="plClose" class="btn ghost">Chiudi</button>
        </div>
      </div>
      <div id="plList"></div>
      <div class="actions" style="justify-content:flex-end; gap:8px">
        <button id="plPrev" class="btn ghost">◀︎ Precedente</button>
        <button id="plNext" class="btn ghost">Successivo ▶︎</button>
        <button id="plPlay" class="btn btn-primary">Apri su YouTube</button>
      </div>
    </div>
  </div>

  <!-- Overlay: PUZZLE -->
  <div id="pzOverlay" class="overlay hidden" aria-hidden="true">
    <div class="pz-topbar">
      <button id="pzBack" class="chip">◀︎ Indietro</button>
      <div class="chip"><span>⏱️</span><span id="pzTime">00:00</span></div>
      <div class="chip"><span>❤️</span><span id="pzLives">3</span></div>
      <div class="chip"><span>⭐</span><span id="pzScore">0</span></div>
      <div class="chip">Difficoltà:
        <button class="chip-btn" data-diff="3">3×3</button>
        <button class="chip-btn active" data-diff="4">4×4</button>
        <button class="chip-btn" data-diff="5">5×5</button>
      </div>
      <button id="pzNext" class="chip">📷 Nuova foto</button>
      <button id="pzClose" class="chip">✕</button>
    </div>

    <div class="pz-stage">
      <div class="pz-img-wrap">
        <img id="pzImg" src="" alt="puzzle" />
        <div id="pzGrid"></div>
        <img id="noImg" class="no-img hidden" src="./assets/images/alessia.png" alt="No" />
      </div>
    </div>

    <div id="pzCard" class="qa-card">
      <div id="pzQuestion" class="qa-title">Domanda…</div>
      <div id="pzAnswers" class="qa-answers"></div>
    </div>

    <!-- suoni -->
    <audio id="fxOk" preload="auto"><source src="./assets/audio/correct.mp3" type="audio/mpeg" /></audio>
    <audio id="fxWrong" preload="auto"><source src="./assets/audio/wrong.mp3" type="audio/mpeg" /></audio>
    <audio id="fxGun" preload="auto"><source src="./assets/audio/gun_shot.mp3" type="audio/mpeg" /></audio>
    <audio id="fxWhip" preload="auto"><source src="./assets/audio/frusta.mp3" type="audio/mpeg" /></audio>
    <audio id="fxVictory" preload="auto"><source src="./assets/audio/vittoria.mp3" type="audio/mpeg" /></audio>
    <audio id="bgPuzzle" loop preload="auto"><source src="./assets/audio/lo_chiamavano_trinita.mp3" type="audio/mpeg" /></audio>
  </div>

  <!-- Script -->
    <script src="./app.js?v=43"></script>
  <script>
    if ('serviceWorker' in navigator){
      addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=40').catch(()=>{});
      });
    }
  </script>

  <!-- WS Scenery: ... -->
  <div class="ws-scenery" aria-hidden="true">
    ...
  </div>

</body>
</html>
